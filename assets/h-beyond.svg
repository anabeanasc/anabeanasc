  <style>
    .t { font-family: ui-monospace,'SFMono-Regular','Cascadia Code',Consolas,'Liberation Mono',monospace; }
    @keyframes blink { 0%,49% { opacity: 1 } 50%,100% { opacity: 0 } }
    @keyframes twinkle { 0%,100% { opacity: 1 } 50% { opacity: .25 } }
