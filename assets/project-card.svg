<svg xmlns="http://www.w3.org/2000/svg" width="900" height="190" viewBox="0 0 900 190" role="img" aria-label="Projeto: Prompt Engineering para Análise de Dados">
  
  <style>
    .t { font-family: ui-monospace,'SFMono-Regular','Cascadia Code',Consolas,'Liberation Mono',monospace; }
    @keyframes blink { 0%,49% { opacity: 1 } 50%,100% { opacity: 0 } }
    @keyframes twinkle { 0%,100% { opacity: 1 } 50% { opacity: .25 } }
    @keyframes rise { from { opacity: 0; transform: translateY(6px) } to { opacity: 1; transform: none } }
    .cur { animation: blink 1.1s steps(1) infinite; }
    .tw { animation: twinkle 3.2s ease-in-out infinite; }
    .in { animation: rise .9s ease-out both; }
    @media (prefers-reduced-motion: reduce) { .cur, .tw, .in { animation: none } }
  </style>
  <rect x="1" y="1" width="898" height="188" rx="10" fill="#161b22" stroke="#30363d"/>
  <rect x="1" y="1" width="8" height="188" rx="4" fill="#8b5cf6"/>
  <g class="t">
    <text x="36" y="44" fill="#8b949e" font-size="14">anabeanasc / prompt-engineering-analise-dados-notebooklm</text>
    <text x="36" y="82" fill="#e6edf3" font-size="24" font-weight="700">Prompt Engineering para Análise de Dados</text>
    <text x="36" y="114" fill="#8b949e" font-size="15">How small businesses without a data analyst can pull reliable insights</text>
    <text x="36" y="136" fill="#8b949e" font-size="15">from spreadsheets with AI: Chain of Thought, Few-Shot and reusable prompts.</text>
    <g font-size="13">
      <rect x="36" y="152" width="110" height="24" rx="12" fill="#2e1065"/><text x="52" y="169" fill="#c4b5fd">NotebookLM</text>
      <rect x="156" y="152" width="96" height="24" rx="12" fill="#3b0764"/><text x="172" y="169" fill="#a78bfa">GenAI</text>
      <rect x="262" y="152" width="150" height="24" rx="12" fill="#172554"/><text x="278" y="169" fill="#93c5fd">Data Analysis</text>
    </g>
    <text x="864" y="169" text-anchor="end" fill="#e6edf3" font-size="14">view project →</text>
  </g>
</svg>